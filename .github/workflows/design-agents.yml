# Design-system builder/validator loop.
#
# Setup (one-time, by the repository owner):
#   1. Run `opencode github install` to install the OpenCode GitHub App and add secrets,
#      OR install github.com/apps/opencode-agent manually and add the workflow secrets below.
#   2. Add secret OPENROUTER_API_KEY (provider key for z-ai/glm-5.3-flash and deepseek-v4.1-flash).
#
# Trigger contract:
#   status:in-progress | status:changes-requested -> builder job
#   builder opens a PR into design-system and marks the issue validating
#   design-pr-check.yml runs the deterministic repository tests and sets the verdict
#
# Builder model and prompt live in opencode.json. Tests, not model assertions,
# determine whether a PR passes.
#
# This file lives on the default branch (main) because `issues` events only run
# workflows present on the default branch. It checks out `design-system`, where
# the code, opencode.json and tools live.

name: Design agents

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: design-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.label.name == 'status:in-progress' ||
      github.event.label.name == 'status:changes-requested'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: design-system
          fetch-depth: 0
          persist-credentials: false

      - name: Run builder
        uses: anomalyco/opencode/github@latest
        timeout-minutes: 45
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/z-ai/glm-5.3-flash
          agent: builder
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} for the height-safety
            design-system workstream. Read the issue body, its acceptance checklist and its
            dependencies. Open a pull request into the `design-system` branch when done and
            never merge.

      - name: Retarget PR to design-system
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          pr_json="$(gh pr list --repo "$GH_REPOSITORY" --state open --limit 100 \
            --json number,title,body)"
          pr_number="$(PR_JSON="$pr_json" ISSUE_NUMBER="$ISSUE_NUMBER" node -e '
            const prs = JSON.parse(process.env.PR_JSON);
            const n = process.env.ISSUE_NUMBER;
            const pr = prs.find((item) => new RegExp(`#${n}(?![0-9])`).test(`${item.title}\n${item.body ?? ""}`));
            if (pr) process.stdout.write(String(pr.number));
          ')"
          if [ -z "$pr_number" ]; then
            echo "Builder did not open a PR referencing issue #$ISSUE_NUMBER" >&2
            exit 1
          fi
          base="$(gh pr view "$pr_number" --repo "$GH_REPOSITORY" --json baseRefName --jq .baseRefName)"
          if [ "$base" != "design-system" ]; then
            gh pr edit "$pr_number" --repo "$GH_REPOSITORY" --base design-system
          fi
          needs_owner="$(gh issue view "$ISSUE_NUMBER" --repo "$GH_REPOSITORY" \
            --json labels --jq '[.labels[].name] | index("needs-owner") != null')"
          if [ "$needs_owner" = "true" ]; then
            gh pr edit "$pr_number" --repo "$GH_REPOSITORY" --add-reviewer jdhc3m
          fi

      - name: Reset on builder failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Builder run failed or timed out. Ticket is quarantined as agent:failed; inspect the run and remove that label before retrying."
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --remove-label "status:in-progress" --remove-label "status:changes-requested" \
            --remove-label "status:ready" --add-label "status:blocked" --add-label "agent:failed"

      - name: Mark validating
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --remove-label "status:in-progress" \
            --remove-label "status:changes-requested" \
            --add-label "status:validating"
