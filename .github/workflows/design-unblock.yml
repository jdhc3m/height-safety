# Promotes `status:blocked` issues to `status:ready` when the issue they waited on
# closes and all of their "Depends on:" / "Blocked by:" dependencies are CLOSED.
# Label writes use GITHUB_TOKEN, which intentionally does not re-trigger other
# workflows: `status:ready` is a pickup state, and the builder only starts on
# `status:in-progress`, so no recursive trigger is needed.

name: Design unblock

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: design-unblock-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Promote unblocked dependents
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/agent-loop/unblock.mjs "${{ github.event.issue.number }}"
