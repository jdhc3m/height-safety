# Tests the actual design-system PR. Split across two runners so the expensive,
# flaky part (the Android emulator) runs on the owner's Mac instead of paid
# cloud runners:
#   - verify:    ubuntu-latest runs tools/verify.sh (docs/format/lint/contracts/
#                tokens/icons/JVM+web tests) against a disposable Postgres service.
#   - emulator:  self-hosted macOS runner runs :app:connectedDebugAndroidTest.
#                Only starts when Android app/test files changed, and never for
#                fork PRs (public repo + self-hosted runner hygiene). One fresh-
#                emulator retry so a bad boot does not fail the run.
#   - verdict:   joins both results. This workflow remains the only place that
#                can turn a design ticket into status:done.
#
# Runner prerequisites (one-time, by the repository owner):
#   1. Register a self-hosted runner on this repo with the default `macOS` label
#      (config.sh adds `self-hosted`, `macOS` and `X64` automatically).
#   2. Keep Android Studio / command-line tools installed (ANDROID_HOME defaults
#      to ~/Library/Android/sdk when unset) and keep the Mac awake during runs.

name: Design PR checks

on:
  pull_request:
    branches: [design-system]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing design-system PR number to validate
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: design-pr-check-${{ github.event.pull_request.number || inputs.pr_number }}
  # Superseded runs (builder pushed again) are killed; only the newest run
  # reaches the verdict job, so the ticket state stays correct.
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      issue_number: ${{ steps.pr.outputs.issue_number }}
      android_required: ${{ steps.android_changes.outputs.required }}
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_POSTGRES_ALLOW_MIGRATION: '1'
      HEIGHT_SAFETY_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Resolve PR and linked ticket
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
            --json headRefName,baseRefName,title,body)"
          PR_JSON="$pr_json" node -e '
            const fs = require("node:fs");
            const pr = JSON.parse(process.env.PR_JSON);
            const linkedIssue = `${pr.title}\n${pr.body ?? ""}`.match(/(?:Issue|Closes|Fixes)\s+#([0-9]+)/i)?.[1] ?? "";
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `number=${process.env.PR_NUMBER}\nhead_ref=${pr.headRefName}\nissue_number=${linkedIssue}\nbase_ref=${pr.baseRefName}\n`);
          '
          if [ "$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json baseRefName --jq .baseRefName)" != "design-system" ]; then
            echo "PR must target design-system" >&2
            exit 1
          fi

      - name: Check out PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || steps.pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Android UI changes
        id: android_changes
        run: |
          changed_paths="$(git diff --name-only origin/design-system...HEAD)"
          if printf '%s\n' "$changed_paths" | grep -Eq '^(apps/android/app/src/(main|debug|androidTest)/|apps/android/app/build.gradle.kts$|apps/android/build.gradle.kts$|apps/android/gradle/|tools/android-theme.sh$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Android app/test files changed; emulator checks will run."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No Android app/test files changed; skipping emulator to save runner time."
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification gate
        timeout-minutes: 45
        run: tools/verify.sh

  emulator:
    needs: verify
    if: >-
      needs.verify.outputs.android_required == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - name: Check out PR revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Point ANDROID_HOME at the local SDK
        run: echo "ANDROID_HOME=${ANDROID_HOME:-$HOME/Library/Android/sdk}" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Resolve emulator ABI
        id: abi
        run: |
          case "$(uname -m)" in
            arm64|aarch64) echo "abi=arm64-v8a" >> "$GITHUB_OUTPUT" ;;
            *)             echo "abi=x86_64"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run Android instrumented tests (attempt 1)
        id: emu1
        continue-on-error: true
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: ${{ steps.abi.outputs.abi }}
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -no-metrics
          script: |
            source tools/android-env.sh
            bash tools/gradle.sh -p apps/android :app:connectedDebugAndroidTest --no-daemon

      - name: Run Android instrumented tests (attempt 2, fresh emulator)
        id: emu2
        if: always() && steps.emu1.outcome == 'failure'
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: ${{ steps.abi.outputs.abi }}
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -no-metrics
          script: |
            source tools/android-env.sh
            bash tools/gradle.sh -p apps/android :app:connectedDebugAndroidTest --no-daemon

      - name: Fail if both emulator attempts failed
        if: always() && steps.emu1.outcome == 'failure' && steps.emu2.outcome != 'success'
        run: |
          echo "Android instrumented tests failed on two fresh emulator attempts" >&2
          exit 1

      - name: Upload Android build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-pr-${{ needs.verify.outputs.pr_number }}-reports
          path: |
            apps/android/app/build/reports/**
            apps/android/app/build/outputs/**
            apps/android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 7

  verdict:
    needs: [verify, emulator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve PR and linked ticket
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
            --json headRefName,baseRefName,title,body)"
          PR_JSON="$pr_json" node -e '
            const fs = require("node:fs");
            const pr = JSON.parse(process.env.PR_JSON);
            const linkedIssue = `${pr.title}\n${pr.body ?? ""}`.match(/(?:Issue|Closes|Fixes)\s+#([0-9]+)/i)?.[1] ?? "";
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `number=${process.env.PR_NUMBER}\nhead_ref=${pr.headRefName}\nissue_number=${linkedIssue}\nbase_ref=${pr.baseRefName}\n`);
          '

      - name: Mark linked ticket done
        if: >-
          needs.verify.result == 'success' &&
          (needs.emulator.result == 'success' || needs.emulator.result == 'skipped')
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.issue_number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body "Validator: PASS. tools/verify.sh${{ needs.emulator.result == 'success' && ' and the Android emulator checks' || '' }} succeeded for PR #$PR_NUMBER. The scheduled tick will merge and close this ticket."
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --remove-label status:validating --remove-label status:in-progress \
            --remove-label status:changes-requested --add-label status:done

      - name: Return linked ticket for fixes
        if: >-
          steps.pr.outputs.issue_number != '' &&
          !(needs.verify.result == 'success' &&
            (needs.emulator.result == 'success' || needs.emulator.result == 'skipped'))
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.issue_number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body "Validator: FAIL. The verification gate failed for PR #$PR_NUMBER (verify=${{ needs.verify.result }}, emulator=${{ needs.emulator.result }}); see the Design PR checks runs for the failing command. Returning to the builder."
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --remove-label status:validating --add-label status:changes-requested
