# Validates design-system PRs against the deterministic verification gate.
#
#   - verify:    ubuntu-latest runs tools/verify.sh (docs/format/lint/contracts/
#                tokens/icons/JVM+web tests) against a disposable Postgres service.
#   - verdict:   turns the linked ticket into status:done or status:changes-requested.
#
# Android instrumented tests are NOT part of the per-PR gate. The self-hosted
# emulator is slow and infra-flaky, and a per-PR emulator gate bounced whole
# tickets (and verified-green work) back to the builder on infrastructure
# failures. design-emulator.yml now runs :app:connectedDebugAndroidTest on
# merges to design-system and nightly instead. The emulator runner needs the
# self-hosted `macOS` runner with Android SDK installed (ANDROID_HOME defaults
# to ~/Library/Android/sdk when unset).
#
# This file lives on both main and design-system; for pull_request events the
# design-system copy is the one that executes.

name: Design PR checks

on:
  pull_request:
    branches: [design-system]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing design-system PR number to validate
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: design-pr-check-${{ github.event.pull_request.number || inputs.pr_number }}
  # Superseded runs (builder pushed again) are killed; only the newest run
  # reaches the verdict job, so the ticket state stays correct.
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      issue_number: ${{ steps.pr.outputs.issue_number }}
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_POSTGRES_ALLOW_MIGRATION: '1'
      HEIGHT_SAFETY_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Resolve PR and linked ticket
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
            --json headRefName,baseRefName,title,body)"
          PR_JSON="$pr_json" node -e '
            const fs = require("node:fs");
            const pr = JSON.parse(process.env.PR_JSON);
            const linkedIssue = `${pr.title}\n${pr.body ?? ""}`.match(/(?:Issue|Closes|Fixes)\s+#([0-9]+)/i)?.[1] ?? "";
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `number=${process.env.PR_NUMBER}\nhead_ref=${pr.headRefName}\nissue_number=${linkedIssue}\nbase_ref=${pr.baseRefName}\n`);
          '
          if [ "$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json baseRefName --jq .baseRefName)" != "design-system" ]; then
            echo "PR must target design-system" >&2
            exit 1
          fi

      - name: Check out design-system
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: design-system
          fetch-depth: 0
          persist-credentials: false

      - name: Merge PR head into design-system
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          if ! git -c user.name="design-pr-check" -c user.email="ci@heightsafety.invalid" merge --no-ff --no-edit "FETCH_HEAD"; then
            echo "PR does not merge cleanly into design-system" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification gate
        timeout-minutes: 45
        run: tools/verify.sh

  verdict:
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve PR and linked ticket
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
            --json headRefName,baseRefName,title,body)"
          PR_JSON="$pr_json" node -e '
            const fs = require("node:fs");
            const pr = JSON.parse(process.env.PR_JSON);
            const linkedIssue = `${pr.title}\n${pr.body ?? ""}`.match(/(?:Issue|Closes|Fixes)\s+#([0-9]+)/i)?.[1] ?? "";
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `number=${process.env.PR_NUMBER}\nhead_ref=${pr.headRefName}\nissue_number=${linkedIssue}\nbase_ref=${pr.baseRefName}\n`);
          '

      - name: Mark linked ticket done
        if: needs.verify.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.issue_number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body "Validator: PASS. tools/verify.sh succeeded for PR #$PR_NUMBER. The tick will merge and close this ticket; Android instrumented tests run post-merge (Design emulator)."
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --remove-label status:validating --remove-label status:in-progress \
            --remove-label status:changes-requested --add-label status:done

      - name: Return linked ticket for fixes
        if: steps.pr.outputs.issue_number != '' && needs.verify.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.issue_number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body "Validator: FAIL. The verification gate failed for PR #$PR_NUMBER; see the Design PR checks run for the failing command. Returning to the builder."
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --remove-label status:validating --add-label status:changes-requested
