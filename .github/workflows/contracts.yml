name: Contracts

on:
  pull_request:
  push:
    branches:
      - main
      - anchor-mvp-reset

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_POSTGRES_ALLOW_MIGRATION: '1'
      HEIGHT_SAFETY_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository and generated contracts
        run: tools/verify.sh

      - name: Reject incompatible pull-request contract changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          contract_path=contracts/openapi/v1/openapi.json
          if git cat-file -e "$BASE_REF:$contract_path"; then
            base_contract="$(mktemp)"
            trap 'rm -f "$base_contract"' EXIT
            git show "$BASE_REF:$contract_path" > "$base_contract"
            tools/openapi-diff.sh "$base_contract" "$contract_path" \
              --fail-on-incompatible
          else
            echo "No base-branch contract exists; compatibility check starts after this proof lands"
          fi
